<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subject attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="attendance.css">
</head>
<body>
  <section class="card">
    <header class="card-header">
      <h1>Subject attendance</h1>
      <span class="badge">9</span>
    </header>

    <div class="chart">
      <!-- Y axis -->
      <div class="y-axis">
        <span>100</span>
        <span>75</span>
        <span>50</span>
        <span>25</span>
        <span>0</span>
      </div>

      <!-- Scrollable bars -->
      <div class="scroll">
        <div class="plot">
          <div class="grid">
            <i></i><i class="target"></i><i></i><i></i><i></i>
          </div>

          <div class="bars">
            <div class="col warn" style="--v:76.2">
              <span class="pct">76.2%</span>
              <div class="track"><div class="bar"></div></div>
              <span class="code">BCHS<br>0002</span>
            </div>
            <div class="col good" style="--v:88.2">
              <span class="pct">88.2%</span>
              <div class="track"><div class="bar"></div></div>
              <span class="code">BCSC<br>0016</span>
            </div>
            <div class="col good" style="--v:95">
              <span class="pct">95%</span>
              <div class="track"><div class="bar"></div></div>
              <span class="code">BECG<br>0010</span>
            </div>
            <div class="col good" style="--v:91.4">
              <span class="pct">91.4%</span>
              <div class="track"><div class="bar"></div></div>
              <span class="code">BMAS<br>0104</span>
            </div>
            <div class="col warn" style="--v:80">
              <span class="pct">80%</span>
              <div class="track"><div class="bar"></div></div>
              <span class="code">BCHS<br>0802</span>
            </div>
            <div class="col good" style="--v:95.6">
              <span class="pct">95.6%</span>
              <div class="track"><div class="bar"></div></div>
              <span class="code">BCSG<br>0802</span>
            </div>
            <div class="col good" style="--v:100">
              <span class="pct">100%</span>
              <div class="track"><div class="bar"></div></div>
              <span class="code">BECG<br>0808</span>
            </div>
            <div class="col good" style="--v:89.7">
              <span class="pct">89.7%</span>
              <div class="track"><div class="bar"></div></div>
              <span class="code">BELH<br>0811</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <ul class="legend">
      <li><i class="dot good"></i>85%+</li>
      <li><i class="dot warn"></i>75–84%</li>
      <li><i class="dot bad"></i>Below 75%</li>
      <li><i class="dot none"></i>No classes</li>
    </ul>

    <p class="hint">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path fill="currentColor" d="M9 11V5a1.5 1.5 0 0 1 3 0v5h.5V8.5a1.5 1.5 0 0 1 3 0V11h.5v-1a1.5 1.5 0 0 1 3 0v5.5A5.5 5.5 0 0 1 13.5 21h-1.2a5.5 5.5 0 0 1-4.4-2.2L5 15a1.5 1.5 0 0 1 2.3-1.9L9 15z"/>
      </svg>
      Swipe horizontally • Long press a bar for details
    </p>
  </section>
</body>
</html>
